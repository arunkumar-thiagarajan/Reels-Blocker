<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reels Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Reels Blocker</h1>
    <p class="subtitle">Take back control of your feed</p>

    <div class="toggle-list">
      <div class="toggle-item">
        <div class="toggle-info">
          <span class="platform-icon">📷</span>
          <span class="platform-name">Instagram Reels</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-instagram" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-item">
        <div class="toggle-info">
          <span class="platform-icon">👤</span>
          <span class="platform-name">Facebook Reels</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-facebook" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <button id="toggle-all" class="toggle-all-btn">Disable All</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
